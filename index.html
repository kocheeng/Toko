<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kocheeng - Toko Kue Sultan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#FFF8F0;padding-bottom:110px}
.container{max-width:430px;margin:0 auto;background:#FFF8F0;min-height:100vh}
.header{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}
.logo{line-height:1}
.logo h1{font-size:32px;font-weight:900;letter-spacing:-0.5px}
.logo h1 span{color:#FF6B35}
.logo small{font-size:11px;color:#999;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.icon-cart{width:56px;height:56px;background:#FF6B35;color:#fff;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;box-shadow:0 5px 15px rgba(255,107,53,.4);position:relative;cursor:pointer}
.icon-cart small{font-size:8px;font-weight:800;margin-top:1px}
.cart-badge{position:absolute;top:-7px;right:-7px;background:#FF2D55;color:#fff;font-size:11px;font-weight:800;width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #FFF8F0}
.search{margin:10px 18px;background:#fff;padding:14px 15px;border-radius:15px;display:flex;gap:10px;color:#999;box-shadow:0 2px 10px rgba(0,0,0,.05);font-size:14px}
.banner{margin:15px 18px;background:linear-gradient(135deg,#FF6B35,#FF9A5A);border-radius:20px;padding:22px;color:#fff}
.banner h2{font-size:22px;line-height:1.2}
.banner p{font-size:13px;opacity:.9;margin:8px 0 15px}
.banner button{background:#fff;border:none;padding:10px 20px;border-radius:25px;font-weight:700;color:#FF6B35}
.cat{padding:5px 18px;display:flex;gap:10px;overflow-x:auto}
.cat div{background:#fff;padding:9px 16px;border-radius:20px;font-size:13px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.cat .active{background:#FF6B35;color:#fff}
.section{padding:18px}
.section h3{font-size:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.card img{width:100%;height:130px;object-fit:cover}
.card-info{padding:12px}
.card-info b{font-size:14px;display:block}
.card-info small{color:#999;font-size:11px}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:6px}
.price{flex:1;color:#FF6B35;font-weight:900;font-size:15px;background:#FFF0E8;padding:10px 4px;border-radius:12px;text-align:center;line-height:1}
.btn-bag{width:44px;height:44px;border:none;border-radius:13px;font-size:21px;cursor:pointer;background:#FFE8D6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-bag:active{transform:scale(.9);background:#FF6B35}
.btn-cart{width:44px;height:44px;border:none;border-radius:13px;font-size:21px;cursor:pointer;background:#FF6B35;color:#fff;box-shadow:0 4px 12px rgba(255,107,53,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-cart:active{transform:scale(.9)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;justify-content:space-around;padding:16px 0 22px;border-top:1px solid #eee;box-shadow:0 -5px 25px rgba(0,0,0,.1);z-index:90}
.nav a{text-decoration:none;color:#999;font-size:14px;font-weight:600;text-align:center;line-height:1.3}
.nav a.active{color:#FF6B35}
.nav a span{font-size:28px;display:block;margin-bottom:2px}
.chat-btn{position:fixed;bottom:105px;right:18px;width:62px;height:62px;background:#FF6B35;color:#fff;border:none;border-radius:50%;font-size:28px;box-shadow:0 8px 20px rgba(255,107,53,.5);z-index:100;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chat-btn .notif{position:absolute;top:-2px;right:-2px;background:#FF2D55;color:#fff;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.chat-box{position:fixed;bottom:180px;right:15px;width:320px;max-width:calc(100vw - 30px);background:#fff;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,.25);z-index:101;display:none;overflow:hidden}
.chat-header{background:#FF6B35;color:#fff;padding:15px;display:flex;gap:10px;align-items:center}
.chat-header .avatar{width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.chat-header small{opacity:.9;font-size:11px}
.chat-body{height:260px;overflow-y:auto;padding:15px;background:#FFF8F0;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 13px;border-radius:15px;font-size:13px;max-width:80%;line-height:1.4}
.msg.admin{background:#fff;align-self:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.06);border-bottom-left-radius:4px}
.msg.user{background:#FF6B35;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-input{display:flex;padding:10px;gap:8px;background:#fff}
.chat-input input{flex:1;border:1px solid #eee;padding:11px 14px;border-radius:25px;outline:none;font-size:13px}
.chat-input button{background:#FF6B35;color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:18px}
.quick{display:flex;gap:6px;padding:0 10px 10px;background:#fff;overflow-x:auto}
.quick button{white-space:nowrap;background:#FFF0E8;color:#FF6B35;border:1px solid #FFD8C0;padding:6px 12px;border-radius:20px;font-size:11px}
/* POPUP KERANJANG & BELI */
.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:22px;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);z-index:200;display:none;width:330px;max-width:calc(100vw - 30px);text-align:center;max-height:85vh;overflow-y:auto}
.popup img{width:100%;height:140px;object-fit:cover;border-radius:14px;margin-bottom:12px}
.popup h3{margin-bottom:6px}
.popup p{font-size:13px;color:#666;margin-bottom:12px;line-height:1.5}
.popup button{background:#FF6B35;color:#fff;border:none;padding:13px;border-radius:20px;font-weight:700;width:100%;margin-bottom:8px;font-size:14px}
.popup .close{background:#eee;color:#333}
.cart-item{display:flex;gap:10px;align-items:center;background:#FFF8F0;padding:10px;border-radius:14px;margin-bottom:8px;text-align:left}
.cart-item img{width:50px;height:50px;object-fit:cover;border-radius:10px}
.cart-item b{font-size:13px;display:block}
.cart-item small{color:#FF6B35;font-weight:800}
.cart-item span{margin-left:auto;font-size:18px;cursor:pointer}
</style>
</head>
